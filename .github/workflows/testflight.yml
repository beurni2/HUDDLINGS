name: testflight

# An internal build of the app (with the Lab, QUESTIONS.md E1) to the founder's
# internal TestFlight group. Run by hand. It needs the repository secrets
# ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store Connect API key), which
# only the founder adds, and the Team ID, which is not a secret: the repository
# variable APPLE_TEAM_ID (docs/PLAN.md, What I need from you). Nothing here prints them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Everything the pull request runs (tests, parity, strings, no sheet pixels) must pass first.
    uses: ./.github/workflows/ios.yml

  upload:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: The secrets are there
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight needs these, which only the founder can add (secrets, and the variable APPLE_TEAM_ID):$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
      # No secret is in the environment of these steps: package scripts and the tools never see the key.
      - run: npm ci --no-audit --no-fund
      - name: Build the test character and the app's generated assets
        run: |
          node characters/build/build.ts test
          node characters/build/app-assets.ts
      - uses: ./.github/actions/macos-tools
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: The API key, readable only by this job
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive the internal build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project ios/Huddlings.xcodeproj -scheme Huddlings -configuration Internal \
            -destination 'generic/platform=iOS' -archivePath build/Huddlings.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Nothing from the sheets in the build
        run: python3 tools/qa/no_sheet_pixels.py build/Huddlings.xcarchive
      - name: Upload to TestFlight, internal testing only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Huddlings.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
