name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  copy-lint:
    # Rule R7: the copy lint fails the build (spec sections 3 and 20).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Copy lint
        run: python3 tools/copylint/copylint.py
      - name: Copy lint tests
        run: python3 -m unittest discover -s tools/copylint -v
