name: checks

on:
  push:
  pull_request:
  # The TestFlight lane runs these before it uploads.
  workflow_call:

permissions:
  contents: read

jobs:
  copy-lint:
    # Rule R7: the copy lint fails the build (spec sections 3 and 20).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Copy lint
        run: python3 tools/copylint/copylint.py
      - name: The app's code shows only catalogue copy outside the Lab
        run: python3 tools/copylint/strings_build.py code ios
      - name: Copy lint tests
        run: python3 -m unittest discover -s tools/copylint -v
      - name: QA tool tests
        run: |
          pip install -r tools/requirements.txt
          python3 -m unittest discover -s tools/qa -v
      - name: Pre-commit hook tests (the hook run in a repository of stand-ins)
        run: python3 -m unittest discover -s tools -p test_precommit.py -v

  reference-prep:
    # Spec section 5b, phase 2: the reference prep's tests, and each species'
    # ref/ and model.json must be exactly what the scripts write from the
    # sheets and its refmap/ (the founder approves the model at Gate A).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      - name: Tests
        run: python3 -m unittest discover -s characters/refprep -v
      - name: Sheet match tests (planted failures, the crop self-check, exit codes)
        run: python3 -m unittest discover -s characters/sheetmatch -v
      - name: Placement guide tests
        run: python3 -m unittest discover -s tools/guide -v
      - name: References are current
        run: |
          for refmap in characters/*/refmap; do
            species=$(basename "$(dirname "$refmap")")
            python3 characters/refprep/prepare.py "$species"
            # Changed, deleted or new files all count.
            changes=$(git status --porcelain -- "characters/$species")
            if [ -n "$changes" ]; then echo "$changes"; echo "::error::characters/$species is stale; run python3 characters/refprep/prepare.py $species"; exit 1; fi
          done

  runtime-web:
    # The web runtime and the build tools: typecheck, tests, and the shared
    # test vectors both runtimes are held to (characters/format/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Chromium for the renderer tests
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Test vectors are current
        run: |
          npm run vectors
          # Changed, deleted or new files all count.
          changes=$(git status --porcelain -- characters/format/vectors)
          if [ -n "$changes" ]; then echo "$changes"; echo "::error::characters/format/vectors is stale; run npm run vectors"; exit 1; fi

  visual-qa:
    # Phase 1's Visual QA job (spec section 5b): every clip of every package
    # rendered on WebGL on the fixed clock, as a contact sheet at 8 frames per
    # second and an MP4. Parity runs in the ios workflow; the other checks join
    # in phase 4, each proven by a planted failure (docs/PLAN.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg and ImageMagick
        run: sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Build the test character
        run: node characters/build/build.ts test
      - name: Render every clip
        run: node runtime-web/lab/render-all.ts --out build/qa/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-qa-web
          path: |
            build/qa/web/**/*-sheet.png
            build/qa/web/**/*.mp4
            build/qa/web/**/report.json
          retention-days: 14

  sheet-match:
    # Spec section 5b, The sheet match, and the phase 3 plan (section 4): the
    # dog built from its source, its front still rendered through the WebGL
    # runtime and matched against the turnaround crop. The job fails when a
    # gating check fails (look.ts exits 1) or anything errs (2). The evidence
    # (compare.png, phone.png, match.json) is uploaded either way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: pip install -r tools/requirements.txt
      - name: Build the dog
        run: node characters/build/build.ts dog
      - name: The front's sheet match
        run: node runtime-web/lab/look.ts dog front --qa build/qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sheet-match-dog-front
          path: build/qa/front
          retention-days: 14

  swift-linux:
    # The SpriteKit runtime's pure engine, held to the same vectors. Its
    # Apple-only parts build on the macOS job. The image is the one LIMITATIONS.md
    # runs locally, pinned by digest so a new Swift cannot change the result.
    runs-on: ubuntu-24.04
    container: swift:6.4.1@sha256:870edbd7f37b77dc01ebab7eb4e0475d16be82796a06734d0bdc010cd24ea32f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test --package-path ios/CompanionCore
