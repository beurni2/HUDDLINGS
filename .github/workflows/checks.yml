name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  copy-lint:
    # Rule R7: the copy lint fails the build (spec sections 3 and 20).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Copy lint
        run: python3 tools/copylint/copylint.py
      - name: Copy lint tests
        run: python3 -m unittest discover -s tools/copylint -v
