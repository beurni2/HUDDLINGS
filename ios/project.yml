# The Xcode project, generated by XcodeGen; never edit the .xcodeproj by hand.
# Before generating: node characters/build/build.ts test, and
# node characters/build/app-assets.ts (the icon and the string catalogue).
name: Huddlings
options:
  bundleIdPrefix: app.huddlings
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Internal: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The atlas pages must reach the app byte for byte (characters/format/README.md, Rendering).
    COMPRESS_PNG_FILES: NO
    STRIP_PNG_TEXT: NO
    # Strings written in Swift reach -exportLocalizations, so the catalogue check sees them.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LAB
    # Internal builds go to the founder's internal TestFlight group and carry the Lab (E1).
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: LAB
packages:
  CompanionCore:
    path: CompanionCore
targets:
  Huddlings:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Generated
        excludes: [Info.plist]
      - path: ../build/characters
        type: folder
        buildPhase: resources
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - package: CompanionCore
        product: CompanionSpriteKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Huddlings
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.huddlings.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  HuddlingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Huddlings
schemes:
  Huddlings:
    build:
      targets:
        Huddlings: all
        HuddlingsUITests: [test]
    test:
      config: Debug
      targets: [HuddlingsUITests]
    archive:
      config: Internal
